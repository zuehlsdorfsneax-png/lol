name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Test – Oberflächen-Prüfung im Browser
        run: |
          npx playwright install --with-deps chromium
          npm run build
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4173/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:4173/
          BASE_URL=http://localhost:4173/ npm run smoke
