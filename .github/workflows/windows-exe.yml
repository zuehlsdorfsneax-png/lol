name: Windows-EXE, Mac-App und Android-APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: npm ci
      - name: EXE bauen
        run: npm run exe

      - name: Test – Server und Dateitypen
        shell: pwsh
        run: |
          $exe = (Resolve-Path release/Orbitlabor.exe).Path
          $env:ORBITLABOR_BROWSER = 'none'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 3
          $index = Invoke-WebRequest -Uri http://127.0.0.1:47173/ -UseBasicParsing
          if ($index.StatusCode -ne 200 -or $index.Content -notmatch 'Orbitlabor') { throw 'Startseite fehlt' }
          $js = [regex]::Match($index.Content, 'assets/index-[^"]+\.js').Value
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:47173/$js" -UseBasicParsing
          $type = "$($r.Headers['Content-Type'])"
          if ($type -notmatch 'javascript') { throw "Falscher Dateityp für JavaScript: $type" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Server-Test bestanden ($type)"

      - name: Test – App-Fenster in Edge
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Resolve-Path release/Orbitlabor.exe).Path
          Remove-Item Env:ORBITLABOR_BROWSER -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try {
              $s = Invoke-RestMethod -Uri http://127.0.0.1:47173/__orbitlabor/status
              if ($s.pings -gt 0) { $ok = $true; break }
            } catch {}
          }
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'Edge hat die App nicht geladen.' }
          Write-Host 'Edge hat die App geladen und meldet sich.'

      - uses: actions/upload-artifact@v7
        with:
          name: Orbitlabor-Windows
          path: release/Orbitlabor.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: npm ci
      - run: python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
      - name: Mac-App bauen
        run: npm run mac

      - name: Test – Signatur, Server und Dateitypen
        run: |
          app=release/mac/Apple-Chip/Orbitlabor.app
          codesign --verify --deep --strict "$app"
          ORBITLABOR_BROWSER=none "$app/Contents/MacOS/Orbitlabor" &
          pid=$!
          sleep 3
          curl -sf http://127.0.0.1:47173/ | grep -q Orbitlabor
          js=$(curl -sf http://127.0.0.1:47173/ | grep -o 'assets/index-[^"]*\.js' | head -1)
          curl -sfI "http://127.0.0.1:47173/$js" | grep -qi 'content-type: .*javascript'
          kill $pid
          echo "Mac-Test bestanden"

      - uses: actions/upload-artifact@v7
        with:
          name: Orbitlabor-Mac-Apple-Chip
          path: release/Orbitlabor-Mac-Apple-Chip.zip
          if-no-files-found: error

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Versionsnummer der APK = Anzahl der Commits
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Android-SDK ergänzen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: npm ci
      - name: APK bauen
        run: npm run apk

      - name: Test – Signatur und Inhalt
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs release/Orbitlabor.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging release/Orbitlabor.apk | grep -E "^package|launchable-activity"
          unzip -l release/Orbitlabor.apk | grep -q "assets/public/index.html"
          unzip -l release/Orbitlabor.apk | grep -q "assets/public/assets/predict.worker"
          echo "APK-Test bestanden"

      - uses: actions/upload-artifact@v7
        with:
          name: Orbitlabor-Android
          path: release/Orbitlabor.apk
          if-no-files-found: error

  release:
    needs: [exe, mac, apk]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dl
          merge-multiple: true
      - name: Download-Link aktualisieren (GitHub-Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          cat > notes.md <<EOF
          Orbitlabor – ohne Installation.

          **Windows 10 und 11:** Orbitlabor.exe herunterladen und doppelklicken. Zeigt Windows „Der Computer wurde durch Windows geschützt“, auf „Weitere Informationen“ und „Trotzdem ausführen“ klicken.

          **Android (Handy und Tablet, ab Android 7):** Orbitlabor.apk auf dem Gerät herunterladen und öffnen. Fragt Android nach, die Installation aus dieser Quelle erlauben („Unbekannte Apps installieren“). Neuere Versionen lassen sich einfach darüber installieren – Fortschritt bleibt erhalten.

          **MacBook mit Apple-Chip (M1 bis M4):** Orbitlabor-Mac-Apple-Chip.zip herunterladen, doppelklicken und Orbitlabor.app in „Programme“ ziehen. Beim ersten Start: Systemeinstellungen → Datenschutz & Sicherheit → „Trotzdem öffnen“.

          Die App öffnet sich in einem eigenen Fenster (Chrome oder Edge) oder im Standardbrowser.

          Gebaut aus Commit $GITHUB_SHA.
          EOF
          gh release create app dl/Orbitlabor.exe dl/Orbitlabor-Mac-Apple-Chip.zip dl/Orbitlabor.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Orbitlabor für Windows, Mac und Android' --notes-file notes.md --latest
